name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Go and frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browser
        run: npm exec --prefix frontend -- playwright install --with-deps chromium

      - name: Test Go packages
        run: go test -count=1 -race -tags ci ./...

      - name: Vet Go packages
        run: go vet -tags ci ./...

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Test frontend
        run: npm test --prefix frontend

      - name: Test frontend end-to-end
        run: npm run test:e2e --prefix frontend
