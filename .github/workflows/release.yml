name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check tag format
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH (for example, v1.2.3)." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Test Go packages
        run: go test -count=1 -race -tags ci ./...

      - name: Vet Go packages
        run: go vet -tags ci ./...

      - name: Build frontend
        run: npm run build --prefix frontend

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      APP_VERSION: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux x64
            runner: ubuntu-24.04
            artifact: difftwin-linux-amd64.tar.gz
          - target: Windows x64
            runner: windows-latest
            artifact: difftwin-windows-amd64.zip
          - target: macOS universal
            runner: macos-latest
            artifact: difftwin-macos-universal.zip
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.2
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libgtk-3-dev \
            libsecret-1-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Set up MinGW-w64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Wails CLI (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build Linux application
        if: runner.os == 'Linux'
        run: wails build -platform linux/amd64 -tags webkit2_41 -ldflags "-X main.appVersion=$APP_VERSION"

      - name: Build Windows application
        if: runner.os == 'Windows'
        run: wails build -platform windows/amd64 -ldflags "-X main.appVersion=$env:APP_VERSION"

      - name: Build universal macOS application
        if: runner.os == 'macOS'
        run: wails build -platform darwin/universal -ldflags "-X main.appVersion=$APP_VERSION"

      - name: Package Linux application
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-assets
          tar -C build/bin -czf "release-assets/${{ matrix.artifact }}" difftwin

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Path build/bin/difftwin.exe -DestinationPath "release-assets/${{ matrix.artifact }}"

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            build/bin/DiffTwin.app \
            "release-assets/${{ matrix.artifact }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum difftwin-* | tee SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/difftwin-* release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "DiffTwin $RELEASE_TAG" \
            --generate-notes
